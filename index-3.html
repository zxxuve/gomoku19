<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GOMOKU 18</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b1020;color:#f3f6ff;font-family:system-ui,"Noto Sans KR",sans-serif}.wrap{max-width:1050px;margin:auto;padding:12px}.top{display:flex;justify-content:space-between;align-items:center;gap:8px}.logo{font-size:30px;font-weight:900}.logo b,.result{color:#70e1c1}.layout{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:12px;margin-top:12px}.panel{background:#151d30;border:1px solid #2d3b56;border-radius:14px;padding:12px}.boardtop,.timerrow{display:flex;justify-content:space-between;gap:8px;align-items:center}.turn{font-weight:900;font-size:18px}.muted{color:#9eacc6;font-size:12px}.boardwrap{aspect-ratio:1;width:100%;background:#dcb578;border-radius:8px;overflow:hidden}canvas{width:100%;height:100%;display:block;touch-action:manipulation}.side{display:flex;flex-direction:column;gap:12px}.modes,.buttons{display:grid;grid-template-columns:1fr 1fr;gap:7px}button{border:0;border-radius:9px;padding:11px;background:#70e1c1;color:#0c241e;font:inherit;font-weight:800}button.secondary{background:#2a3852;color:white}button:disabled{opacity:.4}.full{width:100%;margin-top:8px}.timer{font-size:30px;font-weight:900}.bar{height:6px;background:#303e57;margin-top:7px;border-radius:8px}.fill{height:100%;background:#70e1c1;width:100%}.low{background:#ff7e8b}.msg{padding:11px;background:#0d1525;border:1px solid #26344d;border-radius:9px;min-height:42px}.below{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;color:#9eacc6;font-size:12px;margin-top:8px}h2{font-size:15px;margin:0 0 10px}.note{font-size:12px;color:#9eacc6;line-height:1.5}@media(max-width:700px){.layout{grid-template-columns:1fr}.side{display:flex}.wrap{padding:8px}}
</style></head><body><div class="wrap">
<header class="top"><div><div class="logo">GOMOKU <b>18</b></div><div class="muted">18×18 오목 아레나 · 30초 턴</div></div><span class="muted">DARK GAME</span></header>
<div class="layout"><section class="panel"><div class="boardtop"><div><div id="turn" class="turn">게임 시작 전</div><div id="player" class="muted">AI 대전 · 당신은 흑돌</div></div><div id="hint" class="muted">게임 시작을 눌러 주세요.</div></div><div class="boardwrap"><canvas id="board"></canvas></div><div class="below"><span>● 흑 · ○ 백</span><span>연속 5개 이상 승리</span><span id="moves">0수</span></div></section>
<aside class="side"><section class="panel"><h2>대전 모드</h2><div class="modes"><button id="ai">AI 대전</button><button id="local" class="secondary">2인 대전</button></div><button id="start" class="full">게임 시작</button><div class="buttons"><button id="place" disabled>착수하기</button><button id="undo" class="secondary" disabled>무르기</button></div><button id="reset" class="secondary full">새 게임 준비</button><p class="note">게임 시작을 눌러야 타이머가 움직입니다. 위치를 탭한 뒤 착수하기를 누르세요.</p></section>
<section class="panel"><div class="timerrow"><h2>턴 타이머</h2><div id="timer" class="timer">30</div></div><div class="bar"><div id="fill" class="fill"></div></div><p class="note">30초 안에 착수하지 않으면 시간 초과로 패배합니다.</p></section><section class="panel"><h2>게임 결과</h2><div id="message" class="msg">게임 시작을 누르면 흑돌부터 시작합니다.</div></section></aside></div><p class="muted" style="text-align:center">GOMOKU 18</p></div>
<script>
(()=>{'use strict';const N=18,E=0,B=1,W=2,$=id=>document.getElementById(id),cv=$('board'),cx=cv.getContext('2d'),dirs=[[1,0],[0,1],[1,1],[1,-1]];let a,t,s=null,h=[],mode='ai',over=false,started=false,sec=30,clock=null,last=null,waiting=false,result='';
function stop(){if(clock){clearInterval(clock);clock=null}}function timerUI(){$('timer').textContent=sec;$('fill').style.width=sec/30*100+'%';$('fill').classList.toggle('low',sec<=8)}
function timerStart(){stop();if(!started||over)return;sec=30;timerUI();clock=setInterval(()=>{if(!started||over)return;sec--;timerUI();if(sec<=0){over=true;stop();let win=t===B?W:B;result=(win===B?'흑돌 승리!':'흰돌 승리!')+' (시간 초과)';$('message').innerHTML='<b class="result">'+result+'</b>';update()}},1000)}
function fit(){let r=cv.getBoundingClientRect(),d=devicePixelRatio||1;cv.width=r.width*d;cv.height=r.height*d;cx.setTransform(d,0,0,d,0,0);draw()}
function draw(){let r=cv.getBoundingClientRect(),w=r.width;if(!w)return;cx.clearRect(0,0,w,w);cx.fillStyle='#dfb778';cx.fillRect(0,0,w,w);let p=w*.045,z=(w-2*p)/(N-1);cx.strokeStyle='#916738';for(let i=0;i<N;i++){let q=p+i*z;cx.beginPath();cx.moveTo(p,q);cx.lineTo(w-p,q);cx.stroke();cx.beginPath();cx.moveTo(q,p);cx.lineTo(q,w-p);cx.stroke()}[3,8,13].forEach(x=>[3,8,13].forEach(y=>{cx.fillStyle='#83572d';cx.beginPath();cx.arc(p+x*z,p+y*z,Math.max(2,z*.07),0,7);cx.fill()}));for(let y=0;y<N;y++)for(let x=0;x<N;x++)if(a[y][x]){let X=p+x*z,Y=p+y*z;cx.fillStyle=a[y][x]===B?'#17191e':'#fafafa';cx.beginPath();cx.arc(X,Y,z*.43,0,7);cx.fill();if(last&&last.x===x&&last.y===y){cx.strokeStyle='#fa665e';cx.strokeRect(X-z*.14,Y-z*.14,z*.28,z*.28)}}if(s&&started&&!over){cx.strokeStyle='#087c69';cx.beginPath();cx.arc(p+s.x*z,p+s.y*z,z*.34,0,7);cx.stroke()}}
function get(e){let r=cv.getBoundingClientRect(),p=r.width*.045,z=(r.width-2*p)/(N-1),x=Math.round((e.clientX-r.left-p)/z),y=Math.round((e.clientY-r.top-p)/z);return x>=0&&x<N&&y>=0&&y<N?{x,y}:null}
cv.onclick=e=>{if(!started||over||waiting||(mode==='ai'&&t===W))return;let p=get(e);if(!p)return;if(a[p.y][p.x]){$('hint').textContent='이미 돌이 있는 자리예요.';return}s=p;$('hint').textContent=`선택 위치 ${p.x+1}, ${p.y+1}`;update();draw()};
function count(x,y,dx,dy,c){let n=0;for(x+=dx,y+=dy;x>=0&&x<N&&y>=0&&y<N&&a[y][x]===c;x+=dx,y+=dy)n++;return n}function won(x,y,c){return dirs.some(([dx,dy])=>1+count(x,y,dx,dy,c)+count(x,y,-dx,-dy,c)>=5)}
function put(x,y,c){if(!started||over||a[y][x])return;h.push({x,y,c,prev:last?{...last}:null});a[y][x]=c;last={x,y};s=null;if(won(x,y,c)){over=true;stop();result=c===B?'흑돌 승리!':'흰돌 승리!';$('message').innerHTML='<b class="result">'+result+'</b>'}else if(h.length===N*N){over=true;stop();result='무승부!';$('message').textContent=result}else{t=c===B?W:B;$('message').textContent=(t===B?'흑돌':'흰돌')+' 차례입니다.';timerStart()}update();draw();if(!over&&mode==='ai'&&t===W){waiting=true;update();setTimeout(ai,250)}}
function score(x,y,c){let o=c===B?W:B,v=0;for(let[dx,dy]of dirs){let own=1,enemy=0,open=0;for(let d of[-1,1]){let X=x+dx*d,Y=y+dy*d;while(X>=0&&X<N&&Y>=0&&Y<N&&a[Y][X]===c){own++;X+=dx*d;Y+=dy*d}if(X>=0&&X<N&&Y>=0&&Y<N&&!a[Y][X])open++;X=x+dx*d;Y=y+dy*d;while(X>=0&&X<N&&Y>=0&&Y<N&&a[Y][X]===o){enemy++;X+=dx*d;Y+=dy*d}}v+=own>=5?100000:own===4?(open===2?12000:4000):own===3?(open===2?900:150):own===2?35:5;v+=enemy>=4?90000:enemy===3?500:enemy===2?90:0}return v}
function ai(){if(over||!started||mode!=='ai'||t!==W)return;let best=null,bs=-1;for(let y=0;y<N;y++)for(let x=0;x<N;x++)if(!a[y][x]){let near=!h.length;for(let Y=Math.max(0,y-2);Y<=Math.min(N-1,y+2);Y++)for(let X=Math.max(0,x-2);X<=Math.min(N-1,x+2);X++)if(a[Y][X])near=true;if(near){let v=Math.max(score(x,y,W),score(x,y,B)*1.08)+Math.random();if(v>bs){bs=v;best={x,y}}}}waiting=false;if(best)put(best.x,best.y,W)}
function update(){$('turn').textContent=over?result:started?(t===B?'흑돌 차례':'흰돌 차례'):'게임 시작 전';$('player').textContent=mode==='ai'?'AI 대전 · 당신은 흑돌':'같은 기기 2인 대전';$('place').disabled=!started||over||!s||waiting||(mode==='ai'&&t===W);$('undo').disabled=!started||!h.length||over||waiting;$('start').disabled=started&&!over;$('moves').textContent=h.length+'수'}
function init(){stop();a=Array.from({length:N},()=>Array(N).fill(E));t=B;s=null;h=[];over=false;started=false;sec=30;last=null;waiting=false;result='';$('message').textContent='게임 시작을 누르면 흑돌부터 시작합니다.';$('hint').textContent='게임 시작을 눌러 주세요.';timerUI();update();draw()}
$('start').onclick=()=>{if(over||started)return;started=true;$('message').textContent='게임 시작! 흑돌 차례입니다.';$('hint').textContent='교차점을 선택하고 착수하세요.';update();timerStart()};$('reset').onclick=init;$('ai').onclick=()=>{mode='ai';init()};$('local').onclick=()=>{mode='local';init()};$('place').onclick=()=>{if(s&&started&&!over&&!waiting&&!(mode==='ai'&&t===W))put(s.x,s.y,t)};$('undo').onclick=()=>{if(!started||!h.length||over||waiting)return;let n=mode==='ai'&&t===B?2:1;while(n--&&h.length){let m=h.pop();a[m.y][m.x]=E;last=m.prev;t=m.c}s=null;sec=30;timerUI();$('message').textContent='수를 되돌렸습니다.';update();draw();timerStart()};window.addEventListener('resize',fit);init();fit()})();
</script></body></html>
